<!doctype html>
<!-- Source for public/og.png, the one social card. Not built, not served.
     Regenerate: open at exactly 1200x630, device scale factor 1, screenshot the
     viewport, save over public/og.png. Deliberately carries no figure: a number
     baked into a static image goes stale with nothing to catch it. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    inline-size: 1200px;
    block-size: 630px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 28px;
    padding: 0 88px;
    box-sizing: border-box;
    background-color: #0e1829;
    background-image: radial-gradient(rgb(150 180 230 / 0.11) 1px, transparent 1px);
    background-size: 26px 26px;
    color: #eaf1fb;
    font-family: "Geist Variable", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mark {
    inline-size: 64px;
    block-size: 64px;
    border: 2px solid #2c426a;
    border-radius: 14px;
    background: linear-gradient(#f2a950 0 55%, transparent 55%) right / 45% 100% no-repeat;
  }
  h1 {
    margin: 0;
    font-size: 88px;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  h1 span { color: #f2a950; }
  p {
    margin: 0;
    max-inline-size: 22ch;
    font-size: 34px;
    line-height: 1.35;
    color: #b3c2dc;
  }
  .domain {
    font-family: "Geist Mono Variable", monospace;
    font-size: 24px;
    letter-spacing: 0.02em;
    color: #93a6c6;
  }
</style>
</head>
<body>
  <div class="mark"></div>
  <h1>AI Safety <span>Tracker</span></h1>
  <p>An independent, cited index of AI capability, governance and safety.</p>
  <div class="domain">aisafetytracker.org</div>
</body>
</html>
